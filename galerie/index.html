<div class="galerie"></div>

<div id="lightbox">
    <div id="share-btn">
        <i class="eicon-share-arrow"></i>
        <div id="share-links">
            <a id="share-facebook" target="_blank">
                <i class="eicon-facebook" aria-hidden="true"></i>
                Partager sur Facebook
            </a>
            <a id="download-image" href="#">
                <i class="eicon-download-bold" aria-label="Télécharger"></i>
                Télécharger l'image
            </a>
        </div>
    </div>

    <span id="close-btn">
        <i class="eicon-close"></i>
    </span>
    <span id="counter"></span>

    <div id="left-zone" class="click-zone"></div>
    <div id="right-zone" class="click-zone"></div>

    <span id="prev" class="arrow">
        <i class="eicon-chevron-left"></i>
    </span>
    <span id="next" class="arrow">
        <i class="eicon-chevron-right"></i>
    </span>

    <img id="lightbox-img">
</div>
